version: '3.8'

services:
  # 1. Reverse Proxy / TLS Termination
  reverse-proxy:
    image: nginx:alpine
    container_name: antipiracy-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    networks:
      - edge-network
      - internal-network

  # 2. Web Frontend Service
  web:
    build:
      context: .
      dockerfile: ./infra/docker/Dockerfile.web
    container_name: antipiracy-web
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://theatre-security.com/api
    networks:
      - internal-network
    depends_on:
      - api

  # 3. Backend REST API Service
  api:
    build:
      context: .
      dockerfile: ./infra/docker/Dockerfile.api
    container_name: antipiracy-api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - STORAGE_BASE_DIR=/data/private_storage
      - BACKUP_STORAGE_DIR=/data/backups
      - CORS_ORIGIN=https://theatre-security.com,https://admin.theatre-security.com
    volumes:
      - evidence-data:/data/private_storage
      - backup-data:/data/backups
    networks:
      - internal-network
      - db-network
    depends_on:
      postgres:
        condition: service_healthy

  # 4. PostgreSQL Isolated Database
  postgres:
    image: postgres:16-alpine
    container_name: antipiracy-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-theatre_antipiracy_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-theatre_antipiracy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-network

volumes:
  postgres-data:
    driver: local
  evidence-data:
    driver: local
  backup-data:
    driver: local

networks:
  edge-network:
    driver: bridge
  internal-network:
    driver: bridge
  db-network:
    internal: true # Isolated without public routing
