services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: antipiracy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-theatre_antipiracy_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-theatre_antipiracy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - antipiracy-network

  # 2. Backend REST API Service
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: antipiracy_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-theatre_antipiracy_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-anti-piracy-theatre-platform-production-key-2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      STORAGE_BASE_DIR: /app/private_storage
      MAX_VIDEO_UPLOAD_MB: ${MAX_VIDEO_UPLOAD_MB:-5000}
      DRM_PROVIDER: ${DRM_PROVIDER:-mock}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - video_storage:/app/private_storage
    ports:
      - "4000:4000"
    networks:
      - antipiracy-network

  # 3. Next.js Web Frontend
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: antipiracy_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports:
      - "3000:3000"
    networks:
      - antipiracy-network

volumes:
  pgdata:
    driver: local
  video_storage:
    driver: local

networks:
  antipiracy-network:
    driver: bridge
