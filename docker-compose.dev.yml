services:
  postgres:
    image: postgres:16-alpine
    container_name: antipiracy_dev_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: theatre_antipiracy_db
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d theatre_antipiracy_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  dev_pgdata:
